services:
  fight:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POINTS_FILE: /app/data/points.json
      TOKENS_FILE: /app/data/.tokens.json
      AGENT_FILE: /app/data/.agent.json
    volumes:
      - fight-data:/app/data
    expose:
      - "7778"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7778/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  fight-data:
